<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>AR</title>
<meta name="description" content="AR — شبكة اجتماعية جزائرية" />

<!--
  سياسة أمان محتوى صارمة (CSP):
  - default-src 'self': لا شيء يُحمَّل إلا من نفس الدومين افتراضياً
  - script-src 'self': لا سكريبتات inline، لا سكريبتات من دومين خارجي
    (يمنع أغلب هجمات XSS حتى لو حصل حقن HTML بمكان ما بالخطأ)
  - style-src 'self' + خطوط Google (المسموح بها فقط)
  - connect-src: فقط دومين الـAPI وWebSocket تاعنا (تُملأ فعلياً بعد
    الرفع النهائي بدومين الإنتاج الحقيقي - القيم هنا للتطوير المحلي)
  - object-src 'none': يمنع Flash/plugins قديمة تماماً
  - frame-ancestors 'none': يمنع تضمين الموقع بـiframe بموقع آخر (Clickjacking)
  - base-uri 'self': يمنع حقن <base> لإعادة توجيه الروابط النسبية
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self';
  style-src 'self' https://fonts.googleapis.com;
  font-src 'self' https://fonts.gstatic.com;
  img-src 'self' data: https:;
  connect-src 'self' https://ar-backend-tvx7.onrender.com wss://ar-backend-tvx7.onrender.com;
  object-src 'none';
  frame-ancestors 'none';
  base-uri 'self';
  form-action 'self';
" />
<meta http-equiv="X-Content-Type-Options" content="nosniff" />
<meta name="referrer" content="strict-origin-when-cross-origin" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div id="app" class="app-shell" aria-live="polite"></div>
<div id="toast-container" class="toast-container" aria-live="assertive"></div>
<div id="modal-root"></div>

<noscript>
  <div class="noscript-message">هذا الموقع يحتاج JavaScript مفعّلاً للعمل.</div>
</noscript>

<script type="module" src="/js/app.js"></script>
</body>
</html>
